<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pesquisa da Vida</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <div class="app">

        <!-- BARRA LATERAL -->

        <aside class="sidebar">

            <div class="logo">

                <div class="logo-icon">
                    ✦
                </div>

                <span>
                    Pesquisa da Vida
                </span>

            </div>


            <button class="new-chat"
                    onclick="reiniciarConversa()">

                <span>＋</span>

                Nova conversa

            </button>


            <div class="sidebar-title">
                Conversas
            </div>


            <div class="conversation active">

                <span>💬</span>

                Pesquisa da vida

            </div>


            <div class="conversation">

                <span>💬</span>

                Nova conversa

            </div>


            <div class="sidebar-bottom">

                <div class="user-profile">

                    <div class="avatar">
                        U
                    </div>

                    <div>

                        <strong id="nomeUsuario">
                            Usuário
                        </strong>

                        <small>
                            Minha conta
                        </small>

                    </div>

                </div>

            </div>

        </aside>


        <!-- ÁREA PRINCIPAL -->

        <main class="chat">


            <!-- CABEÇALHO -->

            <header class="chat-header">

                <div>

                    <h1>
                        Pesquisa da vida
                    </h1>

                    <p>
                        Converse e responda às perguntas
                    </p>

                </div>


                <button class="menu-button">
                    ⋯
                </button>

            </header>


            <!-- MENSAGENS -->

            <section
                class="messages"
                id="messages"
            >

                <div class="welcome"
                     id="welcome">

                    <div class="welcome-icon">
                        ✦
                    </div>

                    <h2>
                        Olá! 👋
                    </h2>

                    <p>
                        Vamos conversar um pouco?
                        Responda às perguntas abaixo.
                    </p>

                </div>

            </section>


            <!-- CAMPO DE RESPOSTA -->

            <div class="input-area">

                <div class="input-box">

                    <input
                        type="text"
                        id="userInput"
                        placeholder="Digite sua resposta..."
                        autocomplete="off"
                    >

                    <button
                        id="sendButton"
                        onclick="enviarResposta()"
                    >
                        ➤
                    </button>

                </div>


                <p class="disclaimer">

                    Responda às perguntas da forma que
                    achar melhor.

                </p>

            </div>


        </main>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
